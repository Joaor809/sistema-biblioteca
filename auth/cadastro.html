<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Bibliotecários</title>
    <link rel="stylesheet" href="../public/css/cadastro.css">
</head>
<body>
    <main>
        <div class="container">

            <div class="card">
                <div class="card-header">
                    <h3>Cadastrar bibliotecário</h3>
                    <span>Preencha os dados abaixo para poder cadastrar um novo bibliotecário</span>
                </div>
                <div class="card-body">
                    <form action="" method="post">
                        <div class="form-group">
                            <input type="text" id="nome" placeholder=" ">
                            <label>Nome completo</label>
                        </div>
                        <div class="cpf-tel">
                            <div class="form-group">
                                <input type="text" id="cpf" minlength="14" maxlength="14" placeholder=" ">
                                <label>CPF</label>
                            </div>
                            <div class="form-group">
                                <input type="text" id="telefone" minlength="15" maxlength="15" placeholder=" ">
                                <label>Telefone</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <input type="email" id="email" placeholder=" ">
                            <label>Email</label>
                        </div>
                        <div class="form-group">
                            <input type="text" id="senha" placeholder=" ">
                            <label>Senha</label>
                        </div>
                        <div class="btn">
                            <button type="submit">Cadastrar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
<script type="module" src="../public/js/cadastro.js"></script>
</html>
