<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Leitores</title>
    <link rel="stylesheet" href="../public/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../public/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="../public/img/acervis-icone.svg" alt="Logotipo">
        </div>
        <div class="nav-links">
            <a href="http://localhost:3000/"><i class="bi bi-house"></i> Início</a>
            <a href="http://localhost:3000/livros"><i class="bi bi-book"></i> Livros</a>
            <a href="http://localhost:3000/leitores" id="active"><i class="bi bi-people"></i> Leitores</a>
            <a href="http://localhost:3000/emprestimos"><i class="bi bi-arrow-left-right"></i> Empréstimos</a>
        </div>
    </nav>
    <div class="container">
        <header>
            <h3>Cadastro de Leitores</h3>
            <span>Adicione e gerencie os leitores da biblioteca</span>
        </header>
        <main>
            <section class="card-register">
                <h3>Novo leitor</h3>
                <span>Preencha os dados abaixo para cadastrar um leitor</span>
                <form action="http://localhost:3000/readers" method="post">
                    <div class="form-groups">
                        <div class="form-group">
                            <label>Nome completo</label>
                            <input type="text" placeholder="Ex: Maria Oliveira" id="nome">
                        </div>
                        <div class="form-group">
                            <label>telefone</label>
                            <input type="text" placeholder="Ex: (35) 99999-0000" id="telefone" minlength="15" maxlength="15">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="text" placeholder="Ex: exemplo@email.com" id="email">
                        </div>
                        <div class="form-group">
                            <label>CPF</label>
                            <input type="text" placeholder="Ex: 000.000.000-01" id="cpf" minlength="14" maxlength="14">
                        </div>
                    </div>
                    <div class="btn-register">
                        <button type="submit"><i class="bi bi-plus" id="btn-register"></i> Cadastrar Leitor</button>
                    </div>
                </form>
            </section>
            <section class="readers">
                <h3>Leitores cadastrados</h3>
                <span>Lista de todos os leitores registrados</span>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NOME</th>
                            <th>TELEFONE</th>
                            <th>EMAIL</th>
                            <th>CPF</th>
                            <th>AÇÕES</th>
                        </tr>
                    </thead>
                    <tbody class="list-readers">
                        
                    </tbody>
                </table>
                <div class="loading"></div>
            </section>
        </main>
    </div>
</body>
<script type="module" src="../public/js/leitor.js"></script>
</html>
