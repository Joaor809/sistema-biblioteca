<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empréstimos</title>
    <link rel="stylesheet" href="../public/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../public/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="../public/img/acervis-icone.svg" alt="Logotipo">
        </div>
        <div class="nav-links">
            <a href="/"><i class="bi bi-house"></i> Início</a>
            <a href="/livros"><i class="bi bi-book"></i> Livros</a>
            <a href="/leitores"><i class="bi bi-people"></i> Leitores</a>
            <a href="/emprestimos" id="active"><i class="bi bi-arrow-left-right"></i> Empréstimos</a>
        </div>
    </nav>
    <div class="container">
        <header>
            <h3>Controle de Empréstimos</h3>
            <span>Registre e acompanhe os empréstimos de livros</span>
        </header>
        <main>
            <section class="emprestimos">
                <h3>Novo empréstimo</h3>
                <span>Selecione o livro e o leitor para realizar um empréstimo</span>
                <form action="/emprestimo" method="post">
                    <div class="form-groups">
                        <div class="form-group">
                            <select name="livros" id="livro">
                                <option value="" selected disabled>Selecionar livro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <select name="leitores" id="leitor">
                                <option value="" selected disabled>Selecionar leitor</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <input type="date" name="data_emprestimo" id="data_emprestimo">
                        </div>
                        <div class="form-group">
                            <input type="date" name="data_devolucao" id="data_devolucao">
                        </div>
                    </div>
                    <div class="btn-register">
                        <button type="submit"><i class="bi bi-plus" id="btn-register"></i> Cadastrar empréstimo</button>
                    </div>
                </form>
            </section>
            <section class="emprestimos">
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>LIVRO</th>
                                <th>LEITOR</th>
                                <th>DATA EMPRÉSTIMO</th>
                                <th>DATA DEVOLUÇÃO</th>
                                <th>STATUS</th>
                                <th>AÇÃO</th>
                            </tr>
                        </thead>
                        <tbody id="lista-emprestimos">

                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>
<script type="module" src="../public/js/emprestimo.js"></script>
</html>
