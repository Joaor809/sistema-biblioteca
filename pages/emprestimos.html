<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empréstimos</title>
    <link rel="stylesheet" href="../public/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../public/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="../public/img/acervis-icone.svg" alt="Logotipo">
        </div>
        <div class="nav-links">
            <a href="http://localhost:3000/"><i class="bi bi-house"></i> Início</a>
            <a href="http://localhost:3000/livros"><i class="bi bi-book"></i> Livros</a>
            <a href="http://localhost:3000/leitores"><i class="bi bi-people"></i> Leitores</a>
            <a href="http://localhost:3000/emprestimos" id="active"><i class="bi bi-arrow-left-right"></i> Empréstimos</a>
        </div>
    </nav>
    <div class="container">
        <header>
            <h3>Controle de Empréstimos</h3>
            <span>Registre e acompanhe os empréstimos de livros</span>
        </header>
        <main>
            <section class="emprestimos">
                <h3>Novo empréstimo</h3>
                <span>Selecione o livro e o leitor para realizar um empréstimo</span>
                <form action="http://localhost:3000/emprestimo" method="post">
                    <div class="form-groups">
                        <div class="form-group">
                            <select name="livros" id="livros"></select>
                        </div>
                        <div class="form-group">
                            <select name="leitores" id="leitores"></select>
                        </div>
                        <div class="form-group">
                            <input type="date" name="data_emprestimo" id="data_emprestimo">
                        </div>
                        <div class="form-group">
                            <input type="date" name="data_devolucao" id="data_devolucao">
                        </div>
                    </div>
                    <div class="btn-register">
                        <button type="submit"><i class="bi bi-plus" id="btn-register"></i> Cadastrar empréstimo</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
<script src="../public/js/emprestimo.js"></script>
</html>
